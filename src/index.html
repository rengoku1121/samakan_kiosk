<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    if (typeof globalThis === 'undefined') {
      window.globalThis = window;
    }

    if (!Array.prototype.flat) {
      Array.prototype.flat = function(depth) {
        var d = depth === undefined ? 1 : Number(depth) || 0;

        return d
          ? this.reduce(function(acc, val) {
              return acc.concat(
                Array.isArray(val)
                  ? Array.prototype.flat.call(val, d - 1)
                  : val
              );
            }, [])
          : this.slice();
      };
    }

    if (typeof queueMicrotask === 'undefined') {
      window.queueMicrotask = function(callback) {
        Promise.resolve()
          .then(callback)
          .catch(function(error) {
            setTimeout(function() {
              throw error;
            }, 0);
          });
      };
    }

    if (window.PerformanceObserver && window.PerformanceObserver.prototype) {
      var originalPerformanceObserve =
        window.PerformanceObserver.prototype.observe;

      window.PerformanceObserver.prototype.observe = function(options) {
        try {
          if (options && options.entryTypes) {
            return originalPerformanceObserve.call(this, options);
          }

          if (options && options.type) {
            try {
              return originalPerformanceObserve.call(this, {
                entryTypes: [options.type]
              });
            } catch (e) {
              console.warn(
                'PerformanceObserver type not supported by old WebView:',
                options.type
              );
              return;
            }
          }

          return originalPerformanceObserve.call(this, options);
        } catch (e) {
          console.warn(
            'PerformanceObserver ignored for old WebView:',
            e
          );
          return;
        }
      };
    }
  </script>
